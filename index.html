<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recepção - Cadastro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #1A1F26; color: white; display: flex; justify-content: center; padding: 10px; }
        .app-container { width: 100%; max-width: 420px; background-color: #1A1F26; min-height: 100vh; display: flex; flex-direction: column; }
        .top-bar { background-color: #282E3A; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .header { text-align: center; margin: 25px 0 15px; }
        .header-icon { font-size: 50px; color: #00E5FF; margin-bottom: 5px; }
        .header-title { color: #00E5FF; font-size: 20px; font-weight: bold; }
        .form-group { padding: 0 15px; }
        .input-box { background-color: #282E3A; border-radius: 8px; margin-bottom: 12px; display: flex; align-items: center; padding: 12px 15px; }
        .input-box span { color: #00E5FF; font-size: 18px; margin-right: 12px; }
        .input-box input, .input-box textarea { width: 100%; background: transparent; border: none; outline: none; color: white; font-size: 15px; }
        .input-box input::placeholder, .input-box textarea::placeholder { color: #ADB5BD; }
        .btn-submit { background-color: #00E5FF; color: black; border: none; width: calc(100% - 30px); margin: 15px; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .footer { margin-top: auto; text-align: center; color: #ADB5BD; font-size: 13px; padding: 20px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-bar">
            <span>←</span>
            <strong>Recepção - Cadastro</strong>
            <span>⚙</span>
        </div>

        <div class="header">
            <div class="header-icon">👤+</div>
            <div class="header-title">Cadastro de Visitante</div>
        </div>

        <div class="form-group">
            <div class="input-box"><span>👤</span><input type="text" id="nome" placeholder="Nome completo"></div>
            <div class="input-box"><span>📱</span><input type="text" id="whatsapp" placeholder="WhatsApp (com DDD)"></div>
            <div class="input-box"><span>📍</span><input type="text" id="bairro" placeholder="Bairro"></div>
            <div class="input-box"><span>👥</span><input type="text" id="convidado" placeholder="Quem convidou?"></div>
            <div class="input-box"><span>❤️</span><textarea id="oracao" rows="3" placeholder="Pedido de Oração"></textarea></div>
        </div>

        <button class="btn-submit" onclick="enviarDados()">✔ Cadastrar Visitante</button>

        <div class="footer">🔄 Tentar conectar ao Altar</div>
    </div>

    <script>
        async function enviarDados() {
            const payload = {
                nome: document.getElementById('nome').value,
                whatsapp: document.getElementById('whatsapp').value,
                bairro: document.getElementById('bairro').value,
                convidado: document.getElementById('convidado').value,
                oracao: document.getElementById('oracao').value
            };

            const response = await fetch('/cadastrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            alert(result.mensagem);
            if(response.ok) location.reload();
        }
    </script>
</body>
</html>
